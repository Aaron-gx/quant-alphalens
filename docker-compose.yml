services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    restart: unless-stopped

  scheduler:
    build: .
    command: python -m jobs.scheduler
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    restart: unless-stopped
